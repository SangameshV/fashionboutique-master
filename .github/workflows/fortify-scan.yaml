name: Fortify Scan Workflow

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  fortify-scan:
    runs-on: ubuntu-latest

    permissions:
      contents: write
      pull-requests: write

    steps:
      # ✅ Step 1: Checkout (FULL history needed for push)
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # ✅ Step 2: Setup fcli
      - name: Setup Fortify fcli
        uses: fortify/github-action/setup@v3
        with:
          fcli: bootstrapped
        env:
          FCLI_BOOTSTRAP_VERSION: dev_feat.v3.x.create-pr-fcli-action

      # ✅ Step 3: Run fcli
      - name: Run Fortify CI Action
        env:
          SSC_URL: ${{ vars.SSC_URL }}
          SSC_TOKEN: ${{ secrets.SSC_TOKEN }}
          SC_SAST_TOKEN: ${{ secrets.SC_SAST_TOKEN }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}   # ✅ USE DEFAULT TOKEN
          SSC_APPVERSION: ${{ vars.SSC_APPVERSION }}
          AVIATOR_URL: ${{ vars.AVIATOR_URL }}
          AVIATOR_TOKEN: ${{ secrets.AVIATOR_TOKEN }}
          AVIATOR_APP: ${{ vars.AVIATOR_APP }}
          DO_CREATE_PR: ${{ vars.DO_CREATE_PR }}
          DO_PR_COMMENT: ${{ vars.DO_PR_COMMENT }}
          DO_APPLY_REMEDIATIONS: ${{ vars.DO_APPLY_REMEDIATIONS }}
          SC_CLIENT_VERSION: ${{ vars.SC_CLIENT_VERSION}}
          BASE_BRANCH: "main"
        run: |
          fcli action run ci --debug --log-file=${GITHUB_WORKSPACE}/fcli.log

      # ✅ Step 4: Debug Git State (critical)
      - name: Verify Git Status
        if: always()
        run: |
          echo "=== Current Branch ==="
          git branch -a

          echo ""
          echo "=== Remote ==="
          git remote -v

          echo ""
          echo "=== HEAD ==="
          git log -1 --oneline

          echo ""
          echo "=== Files in Commit ==="
          git show --name-status --pretty="" HEAD || echo "No commit"

          echo ""
          echo "=== Remote Heads ==="
          git ls-remote --heads origin || echo "Cannot read remote"

          echo ""
          echo "=== Unpushed commits ==="
          git rev-list origin/$(git rev-parse --abbrev-ref HEAD)..HEAD 2>/dev/null || echo "No upstream"

      # ✅ Step 5: Upload logs
      - name: Upload Debug Logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: fcli-debug
          path: ${{ github.workspace }}/fcli.log
