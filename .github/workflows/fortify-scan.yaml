name: Fortify Scan Workflow

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  fortify-scan:
    runs-on: ubuntu-latest
    permissions:
      contents: write      # ← Required for push access
      pull-requests: write # ← Required if creating PRs
      
    steps:
      # Step 1: Checkout repository code
      - name: Checkout code
        uses: actions/checkout@v4

      # Step 2: Setup Fortify CLI (fcli) development release
      - name: Setup Fortify fcli
        uses: fortify/github-action/setup@v3
        with:
          fcli: bootstrapped
        env:
          FCLI_BOOTSTRAP_VERSION: dev_feat.v3.x.create-pr-fcli-action

      # Step 3: Run fcli action run ci
      - name: Run Fortify CI Action
        env:
          SSC_URL: ${{ vars.SSC_URL }}
          SSC_TOKEN: ${{ secrets.SSC_TOKEN }}
          SC_SAST_TOKEN: ${{ secrets.SC_SAST_TOKEN }}
          GITHUB_TOKEN: ${{ secrets.MY_CUSTOM_GITHUB_TOKEN }}
          SSC_APPVERSION: ${{ vars.SSC_APPVERSION }}
          AVIATOR_URL: ${{ vars.AVIATOR_URL }}
          AVIATOR_TOKEN: ${{ secrets.AVIATOR_TOKEN }}
          AVIATOR_APP: ${{ vars.AVIATOR_APP }}
          DO_CREATE_PR: ${{ vars.DO_CREATE_PR }}
          DO_PR_COMMENT: ${{ vars.DO_PR_COMMENT }}
          DO_APPLY_REMEDIATIONS: ${{ vars.DO_APPLY_REMEDIATIONS }}
          SC_CLIENT_VERSION: ${{ vars.SC_CLIENT_VERSION}}
        run: |
          fcli action run ci --debug --log-file=${GITHUB_WORKSPACE}/fcli.log

      # Step 4: Verify Git Status
      - name: Verify Git Status
        if: always()
        run: |
          echo "=== Current Branch ==="
          git branch -v
          echo ""
          echo "=== Git Status ==="
          git status
          echo ""
          echo "=== Staged Changes ==="
          git diff --cached --name-status || echo "No staged changes"
          echo ""
          echo "=== Unstaged Changes ==="
          git diff --name-status || echo "No unstaged changes"
          echo ""
          echo "=== Commit Status ==="
          git log -1 --oneline
          echo ""
          echo "=== Remote Status ==="
          git fetch origin > /dev/null 2>&1
          git log --oneline -n 5 origin/$(git rev-parse --abbrev-ref HEAD) 2>/dev/null || echo "Remote branch not found or no commits"
          echo ""
          echo "=== Check for unpushed commits ==="
          UNPUSHED=$(git rev-list origin/$(git rev-parse --abbrev-ref HEAD)..HEAD 2>/dev/null | wc -l)
          echo "Unpushed commits: $UNPUSHED"

      # Step 5: Upload Debug Artifacts (always runs, even if earlier steps fail)
      - name: Upload Debug Artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: fcli-log-file
          path: ${{ github.workspace }}/fcli.log
        
